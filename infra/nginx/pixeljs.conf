# PixelJS static site. The certificate is renewed by Certbot using DNS-01.
# Deliberately no COOP/COEP: the scalar E0 runtime does not require shared memory.
server {
    listen 80;
    listen [::]:80;
    server_name pixeljs.com www.pixeljs.com;
    return 308 https://pixeljs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pixeljs.com;
    ssl_certificate /etc/letsencrypt/live/pixeljs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixeljs.com/privkey.pem;
    return 308 https://pixeljs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pixeljs.com;
    ssl_certificate /etc/letsencrypt/live/pixeljs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixeljs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/pixeljs.com/current;
    index index.html;
    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/pixeljs.com-access.log host_combined;
    error_log /var/log/nginx/pixeljs.com-error.log warn;

    # Until build-hashed asset paths exist, revalidate every artifact together.
    # Keep the edge from injecting analytics scripts into the self-contained site.
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; media-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location ~ \.(mjs|js)$ {
        types { text/javascript js mjs; }
        try_files $uri =404;
    }

    location ~ \.(ts|md)$ {
        types { text/plain ts md; }
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }
}
