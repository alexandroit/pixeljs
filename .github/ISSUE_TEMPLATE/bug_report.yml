name: Bug report
description: Something in PixelJS does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code or project that shows the problem. A link to a repository or a pasted snippet both work.
      render: js
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PixelJS version
      placeholder: '0.0.5'
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 155 on Windows 11
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: The PixelJSError code and message, and anything in the browser console.
      render: text
